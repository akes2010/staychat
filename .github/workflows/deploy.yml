# .github/workflows/deploy.yml — GitHub → live VPS, WITHOUT ever touching tenant data.
#
# Pipeline:  push to master → CI (9-suite regression battery) → this workflow.
#
#   • Only runs when CI concluded "success" for a PUSH to master (never for PRs),
#     or when triggered manually from the Actions tab (workflow_dispatch).
#   • Does NOT deploy if the repo has no deploy secrets configured yet (prints
#     a notice and exits green instead of failing every build).
#   • The actual update is executed ON THE SERVER by /root/deploy-dev.sh — the
#     pm2-based production path staychatos.com actually runs:
#       - git fetch/pull as the app user (origin = this repo, branch master)
#       - pnpm install + better-sqlite3 rebuild forced onto the DISTRO node
#         headers (npm_config_nodedir=/usr — Ubuntu's nodejs ships a patched
#         module ABI the official nodejs.org headers don't match)
#       - migrations run BEFORE the reload (additive-only schema changes; the
#         app also re-runs them on boot as a safety net)
#       - pm2 reload staychatos, then this workflow polls /api/health and
#         fails the run if the site doesn't come back
#   - One deploy at a time (concurrency group); the server path comes from the
#     DEPLOY_PATH secret (the vhost app dir the pm2 process runs from).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     VPS hostname or IP          e.g. 203.0.113.10
#   DEPLOY_USER     SSH user                    e.g. root
#   DEPLOY_SSH_KEY  Private key (ed25519) whose PUBLIC key is in the VPS's
#                   ~/.ssh/authorized_keys — use a dedicated deploy key with
#                   access only to this repo's server, not your personal key
#   DEPLOY_PATH     (optional) app dir         default /var/www/staychatos_c_usr46/data/www/staychatos.com
#
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a half-finished production update

jobs:
  deploy:
    # Run only for: CI success on a push to master, or a manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # add required reviewers here for a manual approval gate
    steps:
      - name: Guard — skip cleanly when deploy secrets are not configured
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets (DEPLOY_HOST/DEPLOY_SSH_KEY) not configured — skipping deploy. Everything else stays green."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via /root/deploy-dev.sh (pull → install → migrate → pm2 reload → health check)
        if: steps.guard.outputs.skip == 'false'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/staychatos_c_usr46/data/www/staychatos.com' }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # %b also fixes keys pasted into the secret field as one line with literal \n
          printf '%b\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          DEST="$DEPLOY_USER@$DEPLOY_HOST"
          REMOTE="$DEPLOY_PATH"

          # No pre-check needed: deploy-dev.sh fetches first and no-ops in
          # seconds when the app dir is already on origin/master. (A root
          # `git rev-parse` here would also trip git 2.43's safe-directory
          # guard — the repo belongs to the app user, not root.)
          echo "Deploying $TARGET_SHA → $DEST:$REMOTE"
          $SSH "$DEST" "bash /root/deploy-dev.sh"

          # The deploy script's last step is a zero-downtime pm2 reload — now
          # prove the site actually came back on the new commit.
          SITE="https://staychatos.com"
          for i in $(seq 1 30); do
            if curl -fsS -m 5 "$SITE/api/health" >/dev/null 2>&1; then
              echo "✓ $SITE healthy after deploy (server HEAD: $($SSH "$DEST" "cd $REMOTE && git rev-parse --short HEAD"))"
              exit 0
            fi
            sleep 5
          done
          echo "✗ $SITE did not report healthy within 150s of the reload" >&2
          exit 1
