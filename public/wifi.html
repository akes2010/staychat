<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Wi-Fi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/marketing.css"/>
  <style>
body { background:radial-gradient(700px 350px at 50% -10%, rgba(91,224,140,.10), transparent),
           linear-gradient(160deg,#0A1220 0%,#0E1930 60%,#13233C 100%);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border-radius:24px; padding:36px 32px; width:100%; max-width:420px;
            box-shadow:0 24px 60px rgba(0,0,0,.4); }
    h1 { font-family:'Bricolage Grotesque','Segoe UI',sans-serif; font-size:20px; margin-bottom:4px; }
    .sub { color:var(--ink2); font-size:13px; margin-bottom:24px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--ink2); margin:12px 0 4px; }
    input { width:100%; padding:11px 12px; border:1.5px solid #CBD9D0; border-radius:11px; font-size:15px; font-family:inherit; }
    input:focus { outline:none; border-color:var(--green-deep); box-shadow:0 0 0 3px rgba(0,109,47,.12); }
    button { width:100%; margin-top:20px; padding:12px; background:var(--green-deep); color:#fff; border:none;
             border-radius:var(--pill); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:filter .2s; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:.6; cursor:default; filter:none; }
    .err { display:none; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA;
           border-radius:10px; padding:10px 12px; font-size:13px; margin-top:14px; }
    .result { display:none; margin-top:20px; background:#EAF7EF; border:1px solid #DCE5DF; border-radius:14px; padding:18px; }
    .result .row { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
    .result .row b { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; user-select:all; }
    .hint { text-align:center; font-size:12px; color:#94a3b8; margin-top:18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📶 Guest Wi-Fi</h1>
    <div class="sub">Enter your room number and booking reference from your key sleeve.</div>
    <form id="f">
      <label>Room number</label>
      <input id="room" placeholder="e.g. 101" autocomplete="off" required>
      <label>Booking reference</label>
      <input id="ref" placeholder="e.g. BK-4F7K2Q" autocomplete="off" required>
      <button type="submit" id="btn">Get my Wi-Fi</button>
    </form>
    <div class="err" id="err"></div>
    <div class="result" id="res">
      <div class="row"><span>Network</span><b id="r-net"></b></div>
      <div class="row"><span>Password</span><b id="r-pass"></b></div>
      <div class="row"><span>Speed</span><b id="r-speed"></b></div>
      <div class="row"><span>Valid until</span><b id="r-exp"></b></div>
    </div>
    <div class="hint">Need help? Call reception from your room phone.</div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const res = document.getElementById('res');
      err.style.display = 'none'; res.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Checking…';
      try {
        const q = 'room=' + encodeURIComponent(document.getElementById('room').value.trim()) +
                  '&reference=' + encodeURIComponent(document.getElementById('ref').value.trim());
        const r = await fetch('/api/wifi/my?' + q);
        const body = await r.json();
        if (!r.ok) throw new Error(body.error || 'Could not find your session');
        document.getElementById('r-net').textContent = body.identity;
        document.getElementById('r-pass').textContent = body.password || '—';
        document.getElementById('r-speed').textContent = body.speedDownMbps + '↓ / ' + body.speedUpMbps + '↑ Mbps';
        document.getElementById('r-exp').textContent = body.expiresAt ? String(body.expiresAt).slice(0, 16) : '—';
        res.style.display = 'block';
      } catch (ex) {
        err.textContent = ex.message; err.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Get my Wi-Fi';
      }
    });
  </script>
</body>
</html>
