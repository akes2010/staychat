<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/marketing.css"/>
  <style>
body { background:radial-gradient(900px 420px at 80% -10%, rgba(91,224,140,.10), transparent),
           linear-gradient(160deg,#0A1220 0%,#0E1930 60%,#13233C 100%);
           min-height:100vh; padding:24px 16px; }
    .wrap { max-width:960px; margin:0 auto; }
    .brand { color:#fff; text-align:center; margin-bottom:24px; }
    .brand h1 { font-family:'Bricolage Grotesque','Segoe UI',sans-serif; font-size:26px; font-weight:800; letter-spacing:-.01em; }
    .brand .sub { color:#9FB0C8; font-size:14px; margin-top:4px; }
    .notice { background:rgba(91,224,140,.10); border:1px solid rgba(91,224,140,.32);
              color:#DDF4E6; border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:20px; display:none; }
    .card { background:#fff; border-radius:24px; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--ink2); margin:12px 0 4px; }
    input,select { width:100%; padding:10px 12px; border:1.5px solid #CBD9D0; border-radius:11px; font-size:15px; font-family:inherit;
                   background:#fff; color:var(--ink); transition:border-color .15s, box-shadow .15s; }
    input:focus,select:focus { outline:none; border-color:var(--green-deep); box-shadow:0 0 0 3px rgba(0,109,47,.12); }
    /* Currency selector: the native dropdown popup always renders on a WHITE
       sheet, so option text must be dark there — the page-level white text on
       white options made currencies unreadable/unselectable. The closed control
       is light too, so it matches what the popup shows. */
    #curSel { background:#fff; color:#0f172a; border:1.5px solid #CBD9D0; font-weight:600; cursor:pointer;
              appearance:auto; -webkit-appearance:auto; }
    #curSel option, #curSel optgroup { background:#ffffff !important; color:#0f172a !important; }
    #curSel:hover { border-color:#94a3b8; }
    #curSel:focus { border-color:var(--green-deep); }
    .room { border:1.5px solid #DCE5DF; border-radius:14px; padding:14px; margin-top:10px; cursor:pointer; transition:border-color .15s, background .15s; }
    .room:hover { border-color:#94a3b8; }
    .room.sel { border-color:var(--green-deep); background:#EAF7EF; }
    .room .top { display:flex; justify-content:space-between; align-items:baseline; }
    .room .num { font-weight:800; font-size:16px; }
    .room .price { font-weight:800; color:var(--green-deeper); }
    .room .meta { font-size:12px; color:#64748b; margin-top:2px; }
    .tabs { display:flex; gap:8px; margin-bottom:6px; }
    .tab { flex:1; padding:10px; border:1.5px solid #DCE5DF; background:#F3F6F4; color:var(--ink2);
           border-radius:var(--pill); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
    .tab.active { border-color:var(--green-deep); background:#EAF7EF; color:var(--green-deeper); }
    .fac-extra { display:none; }
    /* .rooms-extra fields are visible in the default rooms mode; setMode()
       hides them via inline display when the Facilities tab is active. */
    #g-group-toggle { width:auto; }
    button { width:100%; margin-top:18px; padding:13px; background:var(--green-deep); color:#fff; border:none;
             border-radius:var(--pill); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:filter .2s, transform .15s; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:disabled { opacity:.55; cursor:default; transform:none; filter:none; }
    .err { display:none; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA;
           border-radius:10px; padding:10px 12px; font-size:13px; margin-top:14px; }
    .ok { display:none; text-align:center; padding:10px 0; }
    .ok .big { font-size:40px; }
    .ok h2 { font-family:'Bricolage Grotesque','Segoe UI',sans-serif; font-size:20px; margin:8px 0 4px; }
    .ok .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px; font-weight:800; letter-spacing:3px;
                background:#EAF9F0; border:2px dashed var(--green-deep); color:var(--green-deeper); border-radius:14px;
                padding:12px; margin:14px 0; user-select:all; }
    .ok .detail { color:var(--ink2); font-size:14px; line-height:1.7; }
    .hint { text-align:center; color:#9FB0C8; font-size:12px; margin-top:18px; }
    @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><h1 id="h-name">Book Your Stay</h1><div class="sub" id="h-sub">Loading…</div></div>
    <div class="notice" id="notice"></div>
    <div class="card" id="step-form">
      <div class="tabs">
        <button type="button" class="tab active" id="tab-rooms">🛏 Rooms</button>
        <button type="button" class="tab" id="tab-facilities">🎪 Facilities</button>
      </div>
      <div id="pane-rooms">
      <div class="grid">
        <div><label>Check-in</label><input type="date" id="cin"></div>
        <div><label>Check-out</label><input type="date" id="cout"></div>
      </div>
      <button id="search" style="margin-top:14px">Search Available Rooms</button>
      <div id="rooms"></div>
      </div>
      <div id="pane-facilities" style="display:none">
        <div class="grid">
          <div><label>Date</label><input type="date" id="f-date"></div>
          <div><label>Guests / Party size</label><input type="number" id="f-party" min="1" value="2"></div>
          <div><label>From</label><input type="time" id="f-start" value="10:00"></div>
          <div><label>Until</label><input type="time" id="f-end" value="14:00"></div>
        </div>
        <button id="f-search" style="margin-top:14px">Search Available Facilities</button>
        <div id="facilities"></div>
      </div>
      <div class="grid" id="guest-fields" style="display:none">
        <!-- Conformed with the system's New Reservation form (individual &
             group): same fields, same order, same options — so what the guest
             fills here drops straight into the desk's booking form on approval. -->
        <div class="rooms-extra" style="grid-column:1/-1">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 10px;cursor:pointer">
            <input type="checkbox" id="g-group-toggle" onchange="window.__gGroupToggleChanged()"> Group booking — multiple rooms, billed to one party
          </label>
          <div id="g-groupname-wrap" style="display:none"><label>Group / Party name</label><input id="g-groupname" placeholder="e.g. Adeyemi Wedding Party"></div>
        </div>
        <div><label>Surname</label><input id="g-surname" autocomplete="family-name"></div>
        <div><label>First / Real Name</label><input id="g-firstname" autocomplete="given-name"></div>
        <div><label>Phone number</label><input id="g-phone" autocomplete="tel"></div>
        <div><label>Email (optional)</label><input id="g-email" type="email" autocomplete="email"></div>
        <div class="rooms-extra" style="grid-column:1/-1"><label>Address</label><input id="g-address" placeholder="Residential address"></div>
        <div class="rooms-extra"><label>Means of Identification</label><select id="g-idtype"></select></div>
        <div class="rooms-extra"><label>ID Number</label><input id="g-idnumber" placeholder="ID number"></div>
        <div class="rooms-extra"><label>Country</label><select id="g-country" onchange="window.__gCountryChanged()"></select></div>
        <div class="rooms-extra"><label>State / Region</label><div id="g-state-wrap"></div></div>
        <div class="rooms-extra"><label>Next of Kin Name</label><input id="g-nokname" placeholder="Full name"></div>
        <div class="rooms-extra"><label>Next of Kin Phone</label><input id="g-nokphone" placeholder="+234…"></div>
        <div class="rooms-extra"><label>Adults</label><input type="number" id="g-adults" min="1" value="1"></div>
        <div class="rooms-extra"><label>Children</label><input type="number" id="g-children" min="0" value="0"></div>
        <div class="fac-extra" style="grid-column:1/-1"><label>Event name (optional)</label><input id="g-event" placeholder="e.g. Adeyemi Wedding"></div>
        <div style="grid-column:1/-1"><label>Special requests / notes (optional)</label><input id="g-notes"></div>
      </div>
      <button id="submit" style="display:none">Reserve — pay at the hotel</button>
      <div class="err" id="err"></div>
    </div>
    <div class="card ok" id="step-done">
      <div class="big">✅</div>
      <h2>Reservation received!</h2>
      <div class="detail" id="d-summary"></div>
      <div class="code" id="d-code"></div>
      <div class="detail">Present this code at the front desk (or mention it on the phone).<br>
        The hotel will confirm your booking — rooms are held on a first-confirm basis.</div>
    </div>
    <div class="hint">Powered by StayChat OS · pay at the hotel — no card needed now</div>
  </div>
  <script src="/js/countries.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let SUBDOMAIN = params.get('hotel');
    const $ = id => document.getElementById(id);
    let selected = new Set();
    let todayStr = new Date().toISOString().slice(0,10);
    // mode: 'rooms' | 'facilities'; facility pick: { kind, id, name, price, currency, priceLabel }
    let mode = 'rooms';
    let facilityPick = null;
    let CURRENCY = '$';
    let CURRENCY_VIEW = null; // { displayCode, displaySymbol, rate, hotelCode } — null = hotel currency only
    let LAST_ROOMS = [], LAST_FACS = null, LAST_FAC_META = null;

    const sym = c => (c === 'USD' ? '$' : c === 'EUR' ? '€' : c === 'GBP' ? '£' : c === 'NGN' ? '₦' : c === 'GHS' ? 'GH₵' : c === 'KES' ? 'KSh' : c === 'ZAR' ? 'R' : c === 'CAD' ? 'C$' : c === 'AUD' ? 'A$' : c === 'INR' ? '₹' : c === 'AED' ? 'د.إ' : c === 'ZAR' ? 'R' : c + ' ');
    // If a converted view is active, show "≈ 153,000 ₦ · hotel charges $100" style pair.
    function moneyHtml(hotelSymbol, hotelAmount) {
      if (!CURRENCY_VIEW || CURRENCY_VIEW.rate == null || CURRENCY_VIEW.displayCode === CURRENCY_VIEW.hotelCode) return hotelSymbol + ' ' + Number(hotelAmount).toLocaleString();
      const conv = hotelAmount * CURRENCY_VIEW.rate;
      // Whole numbers for normal room amounts; keep 2 decimals when the value
      // is small so it never collapses to a misleading "0".
      const shown = conv >= 10 ? Math.round(conv).toLocaleString() : conv.toFixed(2);
      return '<span title="Charged in ' + CURRENCY_VIEW.hotelCode + '">' + CURRENCY_VIEW.displaySymbol + ' ' + shown +
             ' <small style="opacity:.75;font-size:.85em">(≈ ' + hotelSymbol + Number(hotelAmount).toLocaleString() + ' charged)</small></span>';
    }

    // Country → currency options for the manual selector (auto-detect runs first).
    const CURRENCY_OPTS = [['USD','$ US Dollar'],['EUR','€ Euro'],['GBP','£ British Pound'],['NGN','₦ Nigerian Naira'],['GHS','GH₵ Ghanaian Cedi'],['KES','KSh Kenyan Shilling'],['ZAR','R South African Rand'],['CAD','C$ Canadian Dollar'],['AUD','A$ Australian Dollar'],['INR','₹ Indian Rupee'],['AED','د.إ UAE Dirham'],['JPY','¥ Japanese Yen']];

    async function initCurrencyView() {
      try {
        const r = await fetch('/api/booking-engine/guest-currency?subdomain=' + encodeURIComponent(SUBDOMAIN));
        if (!r.ok) return;
        const c = await r.json();
        CURRENCY_VIEW = { hotelCode: c.hotelCurrency, displayCode: c.displayCurrency, displaySymbol: c.displaySymbol, rate: c.rate, hotelSymbol: c.hotelSymbol };
        // Prices may already be on screen (slow detection vs. fast search) —
        // repaint them in the guest's currency as soon as the view arrives.
        rerenderPrices();
        // Selector with the detected currency preselected.
        const sel = document.createElement('select');
        sel.id = 'curSel';        sel.style.cssText = 'margin-top:10px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(255,255,255,.6);background:#fff;color:#0f172a;font-size:13px;font-weight:600;max-width:360px;cursor:pointer';
        sel.innerHTML = '<option value="">' + (c.converted ? '≈ Showing ' + c.displayCode + ' — auto-detected' : c.hotelCode + ' (hotel charges in this)') + '</option>' +
          CURRENCY_OPTS.map(o => '<option value="' + o[0] + '"' + (o[0] === c.displayCurrency ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
          '<option value="' + c.hotelCurrency + '"' + (c.displayCurrency === c.hotelCurrency ? ' selected' : '') + '>' + c.hotelCode + ' — price as charged</option>';
        sel.onchange = async () => {
          const pick = sel.value;
          try {
            const rc = await fetch('/api/booking-engine/guest-currency?subdomain=' + encodeURIComponent(SUBDOMAIN) + '&currency=' + encodeURIComponent(pick));
            const cc = await rc.json();
            CURRENCY_VIEW = { hotelCode: cc.hotelCurrency, displayCode: cc.displayCurrency, displaySymbol: cc.displaySymbol, rate: cc.rate, hotelSymbol: cc.hotelSymbol };
            rerenderPrices();
          } catch (e) {}
        };
        $('h-name').parentElement.appendChild(sel);
      } catch (e) { /* offline / rate API down — hotel currency renders unchanged */ }
    }

    function rerenderPrices() {
      if (LAST_ROOMS.length) {
        document.querySelectorAll('#rooms .room').forEach((el, i) => {
          const rm = LAST_ROOMS[i]; if (!rm) return;
          el.querySelector('.price').innerHTML = moneyHtml(CURRENCY, rm.total);
          el.querySelector('.meta').innerHTML = (rm.type||'') + (rm.view?' · '+rm.view:'') + ' · ' + rm.nights + ' night' + (rm.nights===1?'':'s') + ' @ ' + moneyHtml(CURRENCY, rm.rate);
        });
      }
      if (LAST_FACS) {
        document.querySelectorAll('#facilities .room').forEach((el, i) => {
          const fc = LAST_FACS[i]; if (!fc) return;
          el.querySelector('.price').innerHTML = moneyHtml(CURRENCY, fc.total);
        });
      }
      const done = $('d-summary');
      if (done && done.dataset.total) done.innerHTML = done.dataset.summary.html;
    }

    function setMode(m) {
      mode = m;
      $('tab-rooms').classList.toggle('active', m === 'rooms');
      $('tab-facilities').classList.toggle('active', m === 'facilities');
      $('pane-rooms').style.display = m === 'rooms' ? 'block' : 'none';
      $('pane-facilities').style.display = m === 'facilities' ? 'block' : 'none';
      document.querySelectorAll('.fac-extra').forEach(el => el.style.display = m === 'facilities' ? 'block' : 'none');
      document.querySelectorAll('.rooms-extra').forEach(el => el.style.display = m === 'rooms' ? 'block' : 'none');
      // reset selection state when switching
      selected.clear(); facilityPick = null;
      $('g-group-toggle').checked = false; $('g-groupname-wrap').style.display = 'none';
      $('guest-fields').style.display = 'none'; $('submit').style.display = 'none';
      hideErr();
    }
    $('tab-rooms').onclick = () => setMode('rooms');
    $('tab-facilities').onclick = () => setMode('facilities');

    $('cin').min = todayStr; $('cin').value = todayStr;
    const d2 = new Date(); d2.setDate(d2.getDate()+1);
    $('cout').min = d2.toISOString().slice(0,10); $('cout').value = d2.toISOString().slice(0,10);
    $('f-date').min = todayStr; $('f-date').value = todayStr;

    // ── Conformed guest fields (same options as the system booking form) ───
    // ID types / countries come from the SAME shared lists the desk form uses
    // (js/countries.js), so an ID type or state picked online is the exact
    // string the system stores and renders — no translation on approval.
    $('g-idtype').innerHTML = (window.ID_TYPES || []).map(t => '<option>' + t + '</option>').join('');
    $('g-country').innerHTML = '<option value="">— Select country —</option>' + (window.COUNTRIES || []).map(c => '<option>' + c + '</option>').join('');
    function gStateFieldHTML(country) {
      const states = (window.STATES_BY_COUNTRY || {})[country];
      if (states && states.length) return '<select id="g-state">' + states.map(s => '<option>' + s + '</option>').join('') + '</select>';
      return '<input id="g-state" placeholder="State / Region / Province"/>';
    }
    window.__gCountryChanged = () => { $('g-state-wrap').innerHTML = gStateFieldHTML($('g-country').value); };
    window.__gCountryChanged();

    // Group booking conformance: like the desk's New Reservation form, 2+
    // rooms is a group billed to one party (isGroup + party name); switching
    // Group off trims the pick back to a single room.
    function syncGroupUI() {
      const toggle = $('g-group-toggle');
      if (mode === 'rooms' && selected.size > 1) toggle.checked = true;
      if (!toggle.checked && selected.size > 1) {
        const first = [...selected][0];
        selected = new Set([first]);
        document.querySelectorAll('#rooms .room').forEach(el => el.classList.toggle('sel', selected.has(el.getAttribute('data-id'))));
      }
      $('g-groupname-wrap').style.display = toggle.checked && mode === 'rooms' ? 'block' : 'none';
    }
    window.__gGroupToggleChanged = () => syncGroupUI();
    if (!SUBDOMAIN) { $('h-sub').textContent = 'Add ?hotel=your-hotel to this link'; }

    async function init() {
      if (!SUBDOMAIN) return;
      try {
        const r = await fetch('/api/booking-engine/config?subdomain=' + encodeURIComponent(SUBDOMAIN));
        const b = await r.json();
        if (!r.ok) { $('h-sub').textContent = b.error || 'Booking unavailable'; $('search').disabled = true; return; }
        $('h-name').textContent = b.hotelName;
        $('h-sub').textContent = 'Reserve your room in under a minute';
        CURRENCY = b.currency || '$';
        if (b.notice) { $('notice').textContent = b.notice; $('notice').style.display = 'block'; }
        // Hide the Facilities tab entirely when the hotel has none to sell.
        fetch('/api/booking-engine/facilities?subdomain=' + encodeURIComponent(SUBDOMAIN))
          .then(r => r.ok ? r.json() : null)
          .then(f => { if (f && !(f.halls.length + f.pools.length)) $('tab-facilities').style.display = 'none'; })
          .catch(() => {});
      } catch (e) { $('h-sub').textContent = 'Cannot reach the hotel booking service'; }
    }
    init();
    initCurrencyView();

    function showErr(m){ const e=$('err'); e.textContent=m; e.style.display='block'; }
    function hideErr(){ $('err').style.display='none'; }

    $('search').onclick = async () => {
      hideErr();
      const cin = $('cin').value, cout = $('cout').value;
      if (!cin || !cout || cout <= cin) { showErr('Pick valid dates (check-out after check-in).'); return; }
      if (!SUBDOMAIN) { showErr('Missing hotel — open this page from the hotel\'s booking link.'); return; }
      $('search').disabled = true; $('search').textContent = 'Searching…';
      try {
        const q = 'subdomain=' + encodeURIComponent(SUBDOMAIN) + '&checkIn=' + cin + '&checkOut=' + cout;
        const r = await fetch('/api/booking-engine/availability?' + q);
        const b = await r.json();
        if (!r.ok) throw new Error(b.error || 'Could not load availability');
        LAST_ROOMS = b.rooms.map(rm => ({ roomId: rm.roomId, number: rm.number, type: rm.type, view: rm.view, nights: rm.nights, rate: rm.rate, total: rm.total }));
        $('rooms').innerHTML = b.rooms.length
          ? b.rooms.map(rm =>
              '<div class="room" data-id="' + rm.roomId + '">' +
                '<div class="top"><span class="num">Room ' + rm.number + '</span><span class="price">' + moneyHtml(rm.currency, rm.total) + '</span></div>' +
                '<div class="meta">' + (rm.type||'') + (rm.view?' · '+rm.view:'') + ' · ' + rm.nights + ' night' + (rm.nights===1?'':'s') + ' @ ' + moneyHtml(rm.currency, rm.rate) + '</div>' +
              '</div>').join('')
          : '<p style="color:#64748b;font-size:14px;margin-top:14px">No rooms available for those dates — try different dates or call us.</p>';
        document.querySelectorAll('.room').forEach(el => {
          el.onclick = () => {
            el.classList.toggle('sel');
            const id = el.getAttribute('data-id');
            if (selected.has(id)) selected.delete(id); else selected.add(id);
            syncGroupUI();
            $('guest-fields').style.display = selected.size ? 'grid' : 'none';
            $('submit').style.display = selected.size ? 'block' : 'none';
          };
        });
        $('guest-fields').style.display = 'none'; $('submit').style.display = 'none';
      } catch (e) { showErr(e.message); }
      $('search').disabled = false; $('search').textContent = 'Search Available Rooms';
    };

    // ── Facilities search ─────────────────────────────────────────────────
    $('f-search').onclick = async () => {
      hideErr();
      const date = $('f-date').value, start = $('f-start').value, end = $('f-end').value;
      const size = Math.max(1, parseInt($('f-party').value, 10) || 1);
      if (!date) { showErr('Pick a date.'); return; }
      if (!start || !end || end <= start) { showErr('Pick a valid time window (end after start).'); return; }
      if (!SUBDOMAIN) { showErr('Missing hotel — open this page from the hotel\'s booking link.'); return; }
      $('f-search').disabled = true; $('f-search').textContent = 'Searching…';
      try {
        const r = await fetch('/api/booking-engine/facilities?subdomain=' + encodeURIComponent(SUBDOMAIN));
        const b = await r.json();
        if (!r.ok) throw new Error(b.error || 'Could not load facilities');
        const all = b.halls.map(h => Object.assign(h, { _icon: '🎪' })).concat(b.pools.map(p => Object.assign(p, { _icon: '🏊' })));
        // Check each facility's slot live (sequential — the list is small).
        const checks = [];
        for (const f of all) {
          try {
            const q = 'subdomain=' + encodeURIComponent(SUBDOMAIN) + '&kind=' + f.kind + '&facilityId=' + encodeURIComponent(f.id) +
                      '&date=' + date + '&startTime=' + start + '&endTime=' + end + '&partySize=' + size;
            const c = await (await fetch('/api/booking-engine/facility-availability?' + q)).json();
            checks.push(Object.assign(f, { available: !!c.available, reason: c.reason || null }));
          } catch (e) { checks.push(Object.assign(f, { available: false, reason: 'Could not check availability' })); }
        }
        LAST_FACS = checks.map(f => ({ name: f.name, total: f.kind === 'hall' ? (f.dayRate > 0 ? f.dayRate : f.hourlyRate) : (f.pricePerPersonPerHour || 0) }));
        const priceLabel = f => {
          const amt = f.kind === 'hall' ? (f.dayRate > 0 ? f.dayRate : f.hourlyRate) : (f.pricePerPersonPerHour || 0);
          const unit = f.kind === 'hall' ? (f.dayRate > 0 ? ' day' : '/hour') : '/person/hour';
          if (amt <= 0) return 'Free';
          return moneyHtml(CURRENCY, amt) + '<small style="opacity:.75;font-size:.85em">' + unit + '</small>';
        };
        $('facilities').innerHTML = all.length
          ? checks.map(f =>
              '<div class="room' + (!f.available ? '" style="opacity:.45;cursor:not-allowed' : '') + '" data-kind="' + f.kind + '" data-id="' + f.id + '" data-name="' + escapeA(f.name) + '" data-price="' + (f.kind === 'hall' ? (f.dayRate > 0 ? f.dayRate : f.hourlyRate) : (f.pricePerPersonPerHour || 0)) + '">' +
                '<div class="top"><span class="num">' + f._icon + ' ' + escapeA(f.name) + '</span><span class="price">' + priceLabel(f) + '</span></div>' +
                '<div class="meta">' + escapeA(f.category || '') + (f.capacity ? ' · up to ' + f.capacity + ' guests' : '') + (f.available ? '' : ' · ' + escapeA(f.reason || 'Unavailable')) + '</div>' +
              '</div>').join('')
          : '<p style="color:#64748b;font-size:14px;margin-top:14px">No facilities are available to book right now — call us instead.</p>';
        document.querySelectorAll('#facilities .room').forEach(el => {
          el.onclick = () => {
            if (el.dataset.kind === undefined || el.dataset.id === undefined) return;
            const name = el.querySelector('.num').textContent.trim();
            const already = el.classList.contains('sel');
            document.querySelectorAll('#facilities .room').forEach(x => x.classList.remove('sel'));
            if (already) { facilityPick = null; }
            else { el.classList.add('sel'); facilityPick = { kind: el.dataset.kind, id: el.dataset.id, name: name.replace(/^[^ ]+ /, ''), price: Number(el.dataset.price) || 0 }; }
            $('guest-fields').style.display = facilityPick ? 'grid' : 'none';
            $('submit').style.display = facilityPick ? 'block' : 'none';
            $('submit').textContent = 'Reserve — pay at the hotel';
          };
        });
      } catch (e) { showErr(e.message); }
      $('f-search').disabled = false; $('f-search').textContent = 'Search Available Facilities';
    };
    function escapeA(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    $('submit').onclick = async () => {
      hideErr();
      const surname = $('g-surname').value.trim(), firstName = $('g-firstname').value.trim(), phone = $('g-phone').value.trim();
      if (!surname && !firstName) { showErr('Surname and first name are required.'); return; }
      if (!phone) { showErr('A phone number is required so the hotel can reach you.'); return; }
      // Composite name derived the same way the desk derives it: First Surname.
      const fullName = [firstName, surname].filter(Boolean).join(' ');
      const isGroup = mode === 'rooms' && ($('g-group-toggle').checked || selected.size > 1);
      if (mode === 'rooms') {
        if (!selected.size) { showErr('Select at least one room first.'); return; }
        if (isGroup && selected.size < 2) { showErr('Group bookings need 2 or more rooms — or turn off Group booking.'); return; }
      } else if (!facilityPick) { showErr('Select a facility first.'); return; }
      $('submit').disabled = true; $('submit').textContent = 'Sending…';
      try {
        if (mode === 'rooms') {
          const r = await fetch('/api/booking-engine/book', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ subdomain: SUBDOMAIN, guestName: fullName, surname, firstName,
              guestPhone: phone, guestEmail: $('g-email').value.trim(),
              address: $('g-address').value.trim(), idType: $('g-idtype').value, idNumber: $('g-idnumber').value.trim(),
              country: $('g-country').value, state: ($('g-state') && $('g-state').value) || '',
              nextOfKinName: $('g-nokname').value.trim(), nextOfKinPhone: $('g-nokphone').value.trim(),
              checkIn: $('cin').value, checkOut: $('cout').value, roomIds: [...selected],
              isGroup, groupName: isGroup ? $('g-groupname').value.trim() : null,
              adults: Math.max(1, parseInt($('g-adults').value, 10) || 1),
              children: Math.max(0, parseInt($('g-children').value, 10) || 0),
              notes: $('g-notes').value.trim() })
          });
          const b = await r.json();
          if (!r.ok) throw new Error(b.error || 'Booking failed');
          $('d-summary').innerHTML = 'Reference <b>' + b.reference + '</b> · Room' + (b.rooms.length>1?'s':'') + ' ' +
            b.rooms.map(x=>x.number).join(', ') + ' · ' + b.checkIn + ' → ' + b.checkOut + ' · Total <b>' + CURRENCY + b.total + '</b> (pay at hotel)';
          $('d-code').textContent = b.code;
        } else {
          const r = await fetch('/api/booking-engine/facility-book', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ subdomain: SUBDOMAIN, kind: facilityPick.kind, facilityId: facilityPick.id,
              guestName: fullName, guestPhone: phone, guestEmail: $('g-email').value.trim(),
              date:$('f-date').value, startTime:$('f-start').value, endTime:$('f-end').value,
              partySize: Math.max(1, parseInt($('f-party').value, 10) || 1), eventName: $('g-event').value.trim(),
              notes: $('g-notes').value.trim() })
          });
          const b = await r.json();
          if (!r.ok) throw new Error(b.error || 'Booking failed');
          $('d-summary').innerHTML = 'Reservation <b>' + escapeA(b.facility) + '</b> · ' + b.date + ' · ' + b.startTime + '–' + b.endTime +
            ' · ' + b.partySize + ' guest' + (b.partySize===1?'':'s') + (b.total ? ' · Total <b>' + CURRENCY + b.total + '</b> (pay at hotel)' : '');
          $('d-code').textContent = b.code;
        }
        $('step-form').style.display = 'none';
        $('step-done').style.display = 'block';
        window.scrollTo(0,0);
      } catch (e) { showErr(e.message); }
      $('submit').disabled = false; $('submit').textContent = 'Reserve — pay at the hotel';
    };
  </script>
</body>
</html>
